<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - أحمد ومنار | AHMED ♥ MANAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #fbf8f2; /* بيج دافئ وراقي */
            font-family: 'Cairo', sans-serif;
            color: #1a1a1a; /* نص أسود واضح */
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- تأثير ذرات ذهبية هادئة في الخلفية البيج --- */
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: #c5a059;
            border-radius: 50%;
            opacity: 0.35;
            animation: floatUp 15s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* --- ديكورات الزوايا الفخمة --- */
        .corner-decoration {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 999;
            pointer-events: none;
            border: 2px solid rgba(197, 160, 89, 0.7);
            opacity: 0.8;
        }
        .top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
        .top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
        .bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
        .bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; border-bottom-right-radius: 20px; }

        /* --- إطار بوكيه الورد --- */
        .couple-frame-container {
            width: 210px;
            height: 210px;
            margin: 0 auto 20px auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .couple-ornament-border {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px double #c5a059;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
            animation: rotateSlow 30s linear infinite;
        }
        @keyframes rotateSlow {
            100% { transform: rotate(360deg); }
        }

        .couple-img {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #c5a059;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* شاشة البداية والظرف باللون البيج */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fbf8f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 1s ease, transform 1s ease;
        }

        .instruction-title {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: #8c6d33;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(197,160,89,0.2);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .instruction-sub {
            font-size: 0.95rem;
            color: #555555;
            margin-bottom: 25px;
        }

        .envelope-container {
            position: relative;
            width: 90%;
            max-width: 440px;
            height: 280px;
            background: #f2ebd9;
            border: 2px solid #c5a059;
            border-radius: 6px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .envelope-container:hover { transform: scale(1.02); }

        .flap-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: #e8decc;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            border-bottom: 1px solid rgba(197,160,89,0.4);
            transform-origin: top;
            transition: transform 0.8s ease, opacity 0.5s ease;
            z-index: 4;
        }
        .flap-left { position: absolute; top: 0; left: 0; width: 220px; height: 100%; background: #e0d4c1; clip-path: polygon(0 0, 100% 50%, 0 100%); z-index: 2; }
        .flap-right { position: absolute; top: 0; right: 0; width: 220px; height: 100%; background: #e0d4c1; clip-path: polygon(100% 0, 0 50%, 100% 100%); z-index: 2; }
        .flap-bottom { position: absolute; bottom: 0; left: 0; width: 100%; height: 140px; background: #eae1d0; clip-path: polygon(0 100%, 50% 0, 100% 100%); z-index: 2; }

        .envelope-seal {
            position: absolute;
            z-index: 5;
            width: 75px;
            height: 75px;
            background: #c5a059;
            color: #fbf8f2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(197,160,89,0.5);
            border: 2px solid #ffffff;
            transition: transform 0.5s ease, opacity 0.4s ease;
        }

            background: #fbf8f2;
