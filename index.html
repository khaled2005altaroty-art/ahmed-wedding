<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - أحمد ومنار | AHMED ♥ MANAR</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #fbf8f2;
            font-family: 'Cairo', sans-serif;
            color: #1a1a1a;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* شاشة الظرف المغلق */
        #envelope-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fbf8f2; display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.8s ease;
        }
        .envelope-box {
            background: #ffffff; padding: 50px 35px; border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 2px solid #c5a059;
            max-width: 440px; width: 90%; cursor: pointer;
            animation: pulseGlow 2s infinite; position: relative;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(197, 160, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); }
        }
        .envelope-box h2 { font-family: 'Amiri', serif; font-size: 1.8rem; color: #8c6d33; margin-bottom: 5px; }
        .env-names { font-family: 'Cinzel', serif; font-size: 1.25rem; color: #c5a059; margin-bottom: 15px; letter-spacing: 2px; }
        .envelope-box p { color: #666; font-size: 1rem; margin-bottom: 20px; }
        .open-btn {
            background: #c5a059; color: #fff; border: none; padding: 12px 32px;
            font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(197,160,89,0.3); transition: transform 0.2s;
        }
        .open-btn:hover { transform: scale(1.05); }

        /* تأثير خروج ورقة الجواب من الظرف */
        .sliding-paper {
            position: absolute; width: 85%; max-width: 360px; background: #fff;
            padding: 25px; border-radius: 10px; border: 1px solid #c5a059;
            top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            opacity: 0; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 10000; pointer-events: none;
        }
        .sliding-paper.slide-out {
            transform: translate(-50%, -180%) scale(1); opacity: 1;
        }

        /* المحتوى الرئيسي للدعوة */
        .main-content {
            max-width: 650px; margin: 0 auto; padding: 40px 15px; position: relative; z-index: 2;
            display: none; opacity: 0; transition: opacity 1s ease;
        }
        .main-content.show { display: block; opacity: 1; }

        section {
            background: #ffffff; margin: 40px 0; padding: 45px 25px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(197, 160, 89, 0.2);
            position: relative; opacity: 0; transform: translateY(40px);
            transition: all 0.8s ease-out;
        }
        section.visible { opacity: 1; transform: translateY(0); }

        /* الفواصل والمظاهر الجمالية */
        .ornament-divider {
            display: flex; align-items: center; justify-content: center; margin: 25px 0; color: #c5a059;
        }

            content: ""; height: 1px; width: 100px; background: linear-gradient(90deg, transparent, #c5a059, transparent); margin: 0 15px;
        }
