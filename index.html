<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - أحمد ومنار | AHMED ♥ MANAR</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #fbf8f2;
            font-family: 'Cairo', sans-serif;
            color: #1a1a1a;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* شاشة الظرف الفاخر بخلفية بيج دافئة */
        #envelope-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f3ede2; display: flex; justify-content: center; align-items: center;
            z-index: 99999; transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .envelope-wrapper {
            position: relative; width: 340px; height: 230px; background: #e6dfd5;
            border-radius: 6px; box-shadow: 0 15px 35px rgba(140, 109, 51, 0.15);
            cursor: pointer; transition: transform 0.5s ease;
        }
        .envelope-wrapper:hover { transform: scale(1.02); }
        
        .envelope-flap {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            border-left: 170px solid transparent; border-right: 170px solid transparent;
            border-top: 120px solid #d4c5b9; transform-origin: top;
            transition: transform 0.8s ease-in-out; z-index: 4;
        }
        .open-flap { transform: rotateX(180deg); z-index: 1; }

        .envelope-letter {
            position: absolute; bottom: 10px; left: 15px; width: 310px; height: 190px;
            background: #ffffff; border-radius: 4px; padding: 20px; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: transform 1s ease-in-out 0.4s;
            z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .pull-letter { transform: translateY(-130px) scale(1.05); z-index: 5; }

        .wax-seal {
            position: absolute; top: 95px; left: 50%; transform: translateX(-50%);
            width: 55px; height: 55px; background: #c5a059; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #fff;
            font-size: 1.3rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #fff;
            z-index: 6; transition: opacity 0.3s;
        }

        .main-content {
            max-width: 650px; margin: 0 auto; padding: 40px 15px; position: relative; z-index: 2;
            display: none; opacity: 0; transition: opacity 1s ease;
        }
        .main-content.show { display: block; opacity: 1; }

        section {
            background: #ffffff; margin: 40px 0; padding: 45px 25px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(197, 160, 89, 0.2);
            position: relative; opacity: 0; transform: translateY(40px);
            transition: all 0.8s ease-out;
        }
        section.visible { opacity: 1; transform: translateY(0); }

        .ornament-divider {
            display: flex; align-items: center; justify-content: center; margin: 25px 0; color: #c5a059;
        }
        .ornament-divider::before, .ornament-divider::after {
            content: ""; height: 1px; width: 100px; background: linear-gradient(90deg, transparent, #c5a059, transparent); margin: 0 15px;
        }

        .bouquet-container {
            width: 120px; height: 120px; margin: 0 auto 20px auto;
            border-radius: 50%; overflow: hidden;
            border: 3px solid #c5a059; box-shadow: 0 8px 20px rgba(197,160,89,0.3);
            background: #fdfbf7; display: flex; align-items: center; justify-content: center;
        }
        .bouquet-container img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .names-en { font-family: 'Cinzel', serif; color: #8c6d33; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }
        .basmala { font-family: 'Amiri', serif; font-size: 1.5rem; color: #8c6d33; margin-bottom: 10px; font-weight: bold; }
        .quran-verse { font-family: 'Amiri', serif; font-size: 1.35rem; color: #1a1a1a; line-height: 2.2; margin-bottom: 20px; padding: 0 10px; }
        .names { font-family: 'Amiri', serif; font-size: 2.6rem; color: #1a1a1a; margin: 15px 0; font-weight: 700; }
        .section-title { font-family: 'Amiri', serif; font-size: 1.8rem; color: #8c6d33; margin-bottom: 8px; }
        p { font-size: 1.05rem; line-height: 1.8; color: #333333; margin: 8px 0; }
        .sub-en { font-size: 0.9rem; color: #666666; margin-bottom: 15px; }
