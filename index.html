<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - أحمد ومنار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            font-family: 'Cairo', sans-serif;
            color: #4a154b;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            border: 2px solid #e91e63;
        }
        h1 {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: #c2185b;
            margin-bottom: 10px;
        }
        .names {
            font-size: 2rem;
            font-weight: 700;
            color: #880e4f;
            margin: 20px 0;
            font-family: 'Amiri', serif;
        }
        .details {
            font-size: 1.2rem;
            margin: 15px 0;
            line-height: 1.8;
            text-align: right;
            padding-right: 20px;
        }
        .details p {
            margin: 10px 0;
        }
        .details span {
            font-weight: 700;
            color: #c2185b;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #880e4f;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <p style="font-size: 1.1rem; color: #880e4f;">بكل حب ومودة، يسرنا دعوتكم لحضور حفل زفافنا المبارك</p>
        <h1>حفل زفاف</h1>
        <div class="names">أحمد & منار</div>
        <hr style="width: 50%; border: 0; height: 1px; background: #f8bbd0; margin: 20px auto;">
        
        <div class="details">
            <p>📅 <strong>التاريخ:</strong> 25 نوفمبر 2026</p>
            <p>🕒 <strong>الوقت:</strong> الساعة 3:00 عصراً</p>
            <p>📍 <strong>المكان:</strong> قاعة عُبار - منيا القمح، الشرقية</p>
        </div>

        <div class="footer-note">
            حضوركم يكتمل به فرحتنا وتكتمل سعادتنا!
        </div>
    </div>

</body>
</html>
